# Publishes a GitHub release when a DashGrid tag is pushed, using SSH/CLI only:
# the signed APK and its SHA-256 are already committed in dist/ by the release commit.
name: DashGrid release

on:
  push:
    tags: ["dashgrid-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the committed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#dashgrid-v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "DashGrid $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            "dist/DashGrid-standalone-$VERSION.apk" \
            "dist/DashGrid-standalone-$VERSION.apk.sha256"
          gh release view "$GITHUB_REF_NAME"
